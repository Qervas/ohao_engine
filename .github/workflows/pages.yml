# Deploy the OHAO implementation monograph (site/) to GitHub Pages.
name: Deploy textbook (GitHub Pages)

on:
  push:
    branches: [master, main]
    paths:
      - "site/**"
      - "docs/media/**"
      - "docs/images/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site (materialize media + images from docs/)
        run: |
          set -euo pipefail
          rm -rf _site_publish
          mkdir -p _site_publish

          # Site HTML/CSS/JS (do not rely on untracked local symlinks)
          cp -a site/. _site_publish/

          # Drop any media/images symlink or empty dir from the site copy
          rm -rf _site_publish/media _site_publish/images
          mkdir -p _site_publish/media _site_publish/images

          # Showcase media from docs/ — always, independent of site/media existing in git.
          # Exclude inverse research media from the public Pages tree.
          if [ ! -d docs/media ]; then
            echo "docs/media missing in checkout" >&2
            exit 1
          fi
          for f in docs/media/*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            if [ "$base" = "inverse" ]; then
              echo "skip inverse media: $base"
              continue
            fi
            cp -a "$f" _site_publish/media/
            echo "media: $base"
          done

          if [ ! -d docs/images ]; then
            echo "docs/images missing in checkout" >&2
            exit 1
          fi
          for f in docs/images/*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              inverse_*) echo "skip inverse still: $base"; continue ;;
            esac
            cp -a "$f" _site_publish/images/
            echo "images: $base"
          done

          test -f _site_publish/index.html
          test -f _site_publish/m/path-tracer.html
          test -f _site_publish/m/audio.html
          test -f _site_publish/assets/plates/pt_bindings.svg
          # Cover video + poster must ship (index.html references these paths)
          test -f _site_publish/media/helmet_orbit.mp4
          test -f _site_publish/images/hero_outdoor_graded.jpg

          # Guard: no inverse product strings in published HTML
          if grep -RInE 'inverse_fit|Diff-IR|MAPTEST|quality-plate' _site_publish --include='*.html' ; then
            echo "inverse product content found in site publish tree" >&2
            exit 1
          fi
          echo "Staged publish tree:"
          find _site_publish -type f | wc -l
          ls -la _site_publish/media/
          ls -la _site_publish/images/ | head

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

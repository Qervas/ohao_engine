<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" class="unit-diagram" role="img" aria-label="Descriptor set 0 of the deferred lighting pass: fifteen declared bindings at 0 to 12, 14 and 15, sorted into three classes — sampled with a real resource, written every frame but with no sampler in the shader, and sampled but always the one-by-one dummy image">
<rect width="100%" height="100%" fill="#0f1419"/>
<text x="28" y="26" fill="#c4a574" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="1.5">DESCRIPTOR SET 0 — DeferredLightingPass, 15 declared bindings</text>

<!-- column panels -->
<rect x="28" y="44" width="320" height="212" fill="#1a222c" stroke="#3d4a58" stroke-width="1"/>
<rect x="372" y="44" width="320" height="212" fill="#1a222c" stroke="#3d4a58" stroke-width="1"/>

<!-- left column: bindings 0-7 -->
<g font-family="IBM Plex Mono,monospace" font-size="11">
  <text x="42" y="66" fill="#6e685c">0</text><text x="70" y="66" fill="#e8e2d6" font-family="DM Sans,sans-serif" font-size="12">gBuffer0 — world pos + metallic</text><rect x="326" y="59" width="8" height="8" fill="#7dba8a"/>
  <text x="42" y="90" fill="#6e685c">1</text><text x="70" y="90" fill="#e8e2d6" font-family="DM Sans,sans-serif" font-size="12">gBuffer1 — oct normal, rough, emis</text><rect x="326" y="83" width="8" height="8" fill="#7dba8a"/>
  <text x="42" y="114" fill="#6e685c">2</text><text x="70" y="114" fill="#e8e2d6" font-family="DM Sans,sans-serif" font-size="12">gBuffer2 — albedo + baked AO</text><rect x="326" y="107" width="8" height="8" fill="#7dba8a"/>
  <text x="42" y="138" fill="#6e685c">3</text><text x="70" y="138" fill="#6e685c" font-family="DM Sans,sans-serif" font-size="12">velocity (RG16F)</text><rect x="326" y="131" width="8" height="8" fill="#6e685c"/>
  <text x="42" y="162" fill="#6e685c">4</text><text x="70" y="162" fill="#6e685c" font-family="DM Sans,sans-serif" font-size="12">depth (D32)</text><rect x="326" y="155" width="8" height="8" fill="#6e685c"/>
  <text x="42" y="186" fill="#6e685c">5</text><text x="70" y="186" fill="#e8e2d6" font-family="DM Sans,sans-serif" font-size="12">LightingUBO — 8 lights</text><rect x="326" y="179" width="8" height="8" fill="#7dba8a"/>
  <text x="42" y="210" fill="#6e685c">6</text><text x="70" y="210" fill="#e8e2d6" font-family="DM Sans,sans-serif" font-size="12">CSM array — 4 cascades</text><rect x="326" y="203" width="8" height="8" fill="#7dba8a"/>
  <text x="42" y="234" fill="#6e685c">7</text><text x="70" y="234" fill="#6e685c" font-family="DM Sans,sans-serif" font-size="12">irradiance cube (no sampler)</text><rect x="326" y="227" width="8" height="8" fill="#6e685c"/>
</g>

<!-- right column: bindings 8-15 -->
<g font-family="IBM Plex Mono,monospace" font-size="11">
  <text x="386" y="66" fill="#6e685c">8</text><text x="418" y="66" fill="#6e685c" font-family="DM Sans,sans-serif" font-size="12">prefiltered cube (no sampler)</text><rect x="670" y="59" width="8" height="8" fill="#6e685c"/>
  <text x="386" y="90" fill="#6e685c">9</text><text x="418" y="90" fill="#c4784a" font-family="DM Sans,sans-serif" font-size="12">BRDF LUT (split-sum A,B)</text><rect x="670" y="83" width="8" height="8" fill="#c4784a"/>
  <text x="386" y="114" fill="#6e685c">10</text><text x="418" y="114" fill="#6e685c" font-family="DM Sans,sans-serif" font-size="12">SSAO (written, no sampler)</text><rect x="670" y="107" width="8" height="8" fill="#6e685c"/>
  <text x="386" y="138" fill="#6e685c">11</text><text x="418" y="138" fill="#e8e2d6" font-family="DM Sans,sans-serif" font-size="12">SSGI — half-res indirect</text><rect x="670" y="131" width="8" height="8" fill="#7dba8a"/>
  <text x="386" y="162" fill="#6e685c">12</text><text x="418" y="162" fill="#e8e2d6" font-family="DM Sans,sans-serif" font-size="12">CascadeUBO — viewProj[4]</text><rect x="670" y="155" width="8" height="8" fill="#7dba8a"/>
  <text x="386" y="186" fill="#6e685c">14</text><text x="418" y="186" fill="#e8e2d6" font-family="DM Sans,sans-serif" font-size="12">RT shadow mask (R8)</text><rect x="670" y="203" width="8" height="8" fill="#7dba8a"/>
  <text x="386" y="210" fill="#6e685c">15</text><text x="418" y="210" fill="#e8e2d6" font-family="DM Sans,sans-serif" font-size="12">env map — equirect, 1 mip</text><rect x="670" y="203" width="8" height="8" fill="#7dba8a"/>
</g>

<!-- legend -->
<g font-family="DM Sans,sans-serif" font-size="12">
  <rect x="28" y="278" width="8" height="8" fill="#7dba8a"/>
  <text x="46" y="287" fill="#e8e2d6">sampled, real resource bound</text>
  <rect x="300" y="278" width="8" height="8" fill="#6e685c"/>
  <text x="318" y="287" fill="#e8e2d6">written every frame, no sampler declared in the shader</text>
  <rect x="28" y="302" width="8" height="8" fill="#c4784a"/>
  <text x="46" y="311" fill="#e8e2d6">sampled, but the setter has no caller — always the 1×1 dummy, contents undefined</text>
</g>

<text x="28" y="340" fill="#6e685c" font-family="IBM Plex Mono,monospace" font-size="10">Conceptual. Read from createDescriptors()/updateDescriptorSets() and the frag's declarations — not a capture or a profile.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" class="unit-diagram" role="img" aria-label="The first row of the equirectangular texture is mapped to the zenith by the CDF sampler in env_sampling.glsl and to the nadir by the radiance lookup in pt_miss.rmiss; the two latitude conventions are vertical mirrors of each other.">
  <defs>
    <marker id="ecdf-arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c4784a"/>
    </marker>
    <marker id="ecdf-arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c4a574"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="268" fill="#0f1419"/>

  <!-- equirect texture strip -->
  <rect x="60" y="46" width="104" height="168" fill="#1a222c" stroke="#3d4a58" stroke-width="1"/>
  <rect x="60" y="46" width="104" height="20" fill="#c4784a" fill-opacity="0.28" stroke="#c4784a" stroke-width="1"/>
  <line x1="60" y1="88" x2="164" y2="88" stroke="#3d4a58" stroke-width="1"/>
  <line x1="60" y1="130" x2="164" y2="130" stroke="#3d4a58" stroke-width="1"/>
  <line x1="60" y1="172" x2="164" y2="172" stroke="#3d4a58" stroke-width="1"/>
  <rect x="60" y="194" width="104" height="20" fill="#3d4a58" fill-opacity="0.35"/>

  <text x="112" y="34" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="13" fill="#e8e2d6">equirect texel rows</text>
  <text x="52" y="61" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4784a">y = 0</text>
  <text x="52" y="74" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="11" fill="#6e685c">v ≈ 0</text>
  <text x="52" y="209" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="11" fill="#6e685c">y = H−1</text>
  <text x="52" y="222" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="11" fill="#6e685c">v ≈ 1</text>
  <text x="112" y="240" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="12" fill="#6e685c">one CDF row each</text>

  <!-- the same row, two destinations -->
  <path d="M 168 56 C 300 56, 330 62, 424 68" fill="none" stroke="#c4784a" stroke-width="1.6" marker-end="url(#ecdf-arrow-a)"/>
  <path d="M 168 56 C 300 60, 330 176, 424 190" fill="none" stroke="#c4a574" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ecdf-arrow-b)"/>

  <text x="296" y="112" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="12" fill="#e8e2d6">row 0 becomes…</text>

  <!-- destination A -->
  <rect x="432" y="42" width="252" height="56" fill="#1a222c" stroke="#c4784a" stroke-width="1"/>
  <text x="446" y="64" font-family="IBM Plex Mono,monospace" font-size="13" fill="#c4784a">+Y  zenith</text>
  <text x="446" y="84" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">env_sampling.glsl · acos(dir.y)/π</text>

  <!-- destination B -->
  <rect x="432" y="164" width="252" height="56" fill="#1a222c" stroke="#c4a574" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="446" y="186" font-family="IBM Plex Mono,monospace" font-size="13" fill="#c4a574">−Y  nadir</text>
  <text x="446" y="206" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">pt_miss.rmiss · asin(dir.y)/π + 0.5</text>

  <text x="558" y="134" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="12" fill="#6e685c">v_env = 1 − v_miss</text>
</svg>

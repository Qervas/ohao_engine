<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" class="unit-diagram" role="img" aria-label="Reach of the four mechanisms that could catch a cross-module violation in OHAO: compile-time static asserts and engine_tests stop at the C++ / SPIR-V boundary; Vulkan validation crosses but is opt-in; golden images cross end-to-end but compare coarsely.">
  <rect x="0" y="0" width="720" height="288" fill="#0f1419"/>

  <!-- side panels -->
  <rect x="206" y="60" width="228" height="176" fill="#1a222c"/>
  <rect x="434" y="60" width="270" height="176" fill="#141b23"/>

  <!-- headers -->
  <text x="320" y="46" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="13" fill="#e8e2d6">host / C++</text>
  <text x="569" y="46" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="13" fill="#e8e2d6">GPU / SPIR-V</text>

  <!-- the wall -->
  <line x1="434" y1="60" x2="434" y2="236" stroke="#3d4a58" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="434" y="26" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="#6e685c">no shared type</text>
  <line x1="434" y1="32" x2="434" y2="54" stroke="#3d4a58" stroke-width="1"/>

  <!-- row 1: static_assert -->
  <text x="196" y="90" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="12" fill="#c4a574">static_assert &#215;10</text>
  <rect x="210" y="80" width="216" height="10" fill="#c4a574"/>
  <line x1="428" y1="74" x2="428" y2="96" stroke="#c4a574" stroke-width="2"/>
  <text x="210" y="106" font-family="DM Sans,sans-serif" font-size="11" fill="#6e685c">sizeof + standard-layout, host side only</text>

  <!-- row 2: engine_tests -->
  <text x="196" y="134" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="12" fill="#c4a574">engine_tests</text>
  <rect x="210" y="124" width="216" height="10" fill="#c4a574"/>
  <line x1="428" y1="118" x2="428" y2="140" stroke="#c4a574" stroke-width="2"/>
  <text x="210" y="150" font-family="DM Sans,sans-serif" font-size="11" fill="#6e685c">constants and concepts, never a pipeline</text>

  <!-- row 3: validation -->
  <text x="196" y="178" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="12" fill="#c4784a">Vulkan validation</text>
  <rect x="210" y="168" width="484" height="10" fill="none" stroke="#c4784a" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="210" y="194" font-family="DM Sans,sans-serif" font-size="11" fill="#6e685c">crosses the wall &#8212; opt-in: OHAO_VALIDATION=1</text>

  <!-- row 4: golden -->
  <text x="196" y="222" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="12" fill="#7dba8a">golden images</text>
  <rect x="210" y="212" width="484" height="10" fill="#7dba8a"/>
  <text x="210" y="238" font-family="DM Sans,sans-serif" font-size="11" fill="#6e685c">end-to-end pixels &#8212; 2 scenes, 640 px wide, 4 LSB / 1 %</text>

  <!-- footer -->
  <line x1="206" y1="256" x2="704" y2="256" stroke="#3d4a58" stroke-width="1"/>
  <text x="206" y="274" font-family="DM Sans,sans-serif" font-size="11" fill="#6e685c">The two mechanisms that reach the GPU are the two nothing starts automatically.</text>
</svg>

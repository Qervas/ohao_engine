<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" class="unit-diagram" role="img" aria-label="Mapping from OHAO render-resolution AOV images to NVSDK NGX DLSSD evaluation parameters, and the output chain from COLOR_OUT through the tonemap compute pass to the RGBA8 beauty image. The specular hit-distance guide at binding 35 is drawn muted because it is declared in the descriptor layout but never written into the descriptor set and never assigned into EvalInputs.">
  <defs>
    <marker id="dlssArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4784a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="396" fill="#0f1419"/>

  <!-- guide table -->
  <rect x="16" y="16" width="452" height="234" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="30" y="38" font-family="DM Sans,sans-serif" font-size="13" fill="#e8e2d6">Guide buffers — written by pt_raygen_realtime.rgen at render res</text>
  <line x1="16" y1="48" x2="468" y2="48" stroke="#3d4a58"/>
  <line x1="262" y1="48" x2="262" y2="250" stroke="#3d4a58"/>
  <text x="30" y="66" font-family="IBM Plex Mono,monospace" font-size="10" fill="#6e685c">OHAO IMAGE</text>
  <text x="276" y="66" font-family="IBM Plex Mono,monospace" font-size="10" fill="#6e685c">NGX EVAL PARAM</text>

  <text x="30" y="88"  font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4a574">b1  accum   RGBA32F</text>
  <text x="276" y="88" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">pInColor</text>

  <text x="30" y="110"  font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4a574">b7  normalAOV RGBA32F</text>
  <text x="276" y="110" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">pInNormals + pInRoughness</text>
  <text x="46" y="124"  font-family="DM Sans,sans-serif" font-size="10" fill="#7dba8a">repurposed: xyz = world N, w = roughness</text>

  <text x="30" y="146"  font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4a574">b24 diffAlbedo RGBA8</text>
  <text x="276" y="146" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">pInDiffuseAlbedo</text>

  <text x="30" y="168"  font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4a574">b25 specColor  RGBA8</text>
  <text x="276" y="168" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">pInSpecularAlbedo</text>

  <text x="30" y="190"  font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4a574">b20 depth    R32F</text>
  <text x="276" y="190" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">pInDepth (Depth_Type_Linear)</text>

  <text x="30" y="212"  font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4a574">b19 motion   RG16F</text>
  <text x="276" y="212" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">pInMotionVectors (scale -1,-1)</text>

  <text x="30" y="238"  font-family="IBM Plex Mono,monospace" font-size="11" fill="#6e685c">b35 specHitDist R32F</text>
  <text x="276" y="238" font-family="IBM Plex Mono,monospace" font-size="11" fill="#6e685c">pInSpecularHitDistance</text>
  <line x1="262" y1="222" x2="468" y2="222" stroke="#3d4a58" stroke-dasharray="3 3"/>

  <!-- eval box -->
  <path d="M468,133 L500,133" stroke="#c4784a" stroke-width="1.5" fill="none" marker-end="url(#dlssArrow)"/>
  <rect x="504" y="100" width="200" height="66" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="518" y="124" font-family="IBM Plex Mono,monospace" font-size="10.5" fill="#e8e2d6">NGX_VULKAN_EVALUATE_</text>
  <text x="518" y="138" font-family="IBM Plex Mono,monospace" font-size="10.5" fill="#e8e2d6">DLSSD_EXT</text>
  <text x="518" y="156" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">feature created at render res</text>

  <!-- output chain -->
  <path d="M604,166 L604,196" stroke="#c4784a" stroke-width="1.5" fill="none" marker-end="url(#dlssArrow)"/>
  <rect x="504" y="200" width="200" height="52" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="518" y="222" font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4a574">COLOR_OUT RGBA16F</text>
  <text x="518" y="240" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">image allocated at output res</text>

  <path d="M604,252 L604,282" stroke="#c4784a" stroke-width="1.5" fill="none" marker-end="url(#dlssArrow)"/>
  <rect x="16" y="286" width="688" height="60" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="30" y="308" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">dlss_tonemap.comp</text>
  <text x="30" y="326" font-family="DM Sans,sans-serif" font-size="10.5" fill="#6e685c">8x8 groups &#183; ACES(hdr &#215; 0.5) &#183; gamma 2.2 &#183; grade/vignette/grain/CA gated on OHAO_GRADE</text>
  <text x="470" y="308" font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4a574">&#8594; m_outputImage RGBA8</text>
  <text x="470" y="326" font-family="DM Sans,sans-serif" font-size="10.5" fill="#6e685c">the standard beauty readback</text>

  <text x="16" y="372" font-family="DM Sans,sans-serif" font-size="10.5" fill="#6e685c">Muted row: image allocated, binding declared, but never written into the descriptor set and never assigned into EvalInputs.</text>
</svg>

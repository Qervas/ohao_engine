<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" class="unit-diagram" role="img" aria-label="Octahedral normal data path: gbuffer.frag encodes with a private copy, five consumers decode with the shared header; two other encoder implementations have no callers.">
  <defs>
    <marker id="oc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d4a58"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="320" fill="#0f1419"/>

  <!-- ============ live path (left) ============ -->
  <text x="20" y="24" font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4a574">SHIPPING PATH</text>

  <!-- producer -->
  <rect x="20" y="36" width="430" height="42" rx="3" fill="#1a222c" stroke="#3d4a58"/>
  <text x="32" y="55" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e8e2d6">shaders/core/gbuffer.frag</text>
  <text x="32" y="70" font-family="DM Sans,sans-serif" font-size="11" fill="#6e685c">private encodeNormalOctahedron() &#8594; [-1,1], then &#215;0.5+0.5 at call site</text>

  <line x1="235" y1="78" x2="235" y2="102" stroke="#3d4a58" stroke-width="1.5" marker-end="url(#oc-arrow)"/>

  <!-- gbuffer1 channel strip -->
  <text x="20" y="118" font-family="IBM Plex Mono,monospace" font-size="10" fill="#6e685c">GBuffer1 &#183; VK_FORMAT_R16G16B16A16_SFLOAT</text>
  <g font-family="IBM Plex Mono,monospace" font-size="11">
    <rect x="20" y="126" width="107" height="34" rx="2" fill="#1a222c" stroke="#c4784a"/>
    <text x="34" y="147" fill="#c4784a">R  oct.x</text>
    <rect x="127" y="126" width="107" height="34" rx="2" fill="#1a222c" stroke="#c4784a"/>
    <text x="141" y="147" fill="#c4784a">G  oct.y</text>
    <rect x="234" y="126" width="108" height="34" rx="2" fill="#1a222c" stroke="#3d4a58"/>
    <text x="248" y="147" fill="#e8e2d6">B  rough</text>
    <rect x="342" y="126" width="108" height="34" rx="2" fill="#1a222c" stroke="#3d4a58"/>
    <text x="356" y="147" fill="#e8e2d6">A  emis.lum</text>
  </g>

  <line x1="235" y1="160" x2="235" y2="184" stroke="#3d4a58" stroke-width="1.5" marker-end="url(#oc-arrow)"/>

  <!-- shared decoder -->
  <rect x="20" y="184" width="430" height="38" rx="3" fill="#1a222c" stroke="#7dba8a"/>
  <text x="32" y="202" font-family="IBM Plex Mono,monospace" font-size="12" fill="#7dba8a">decodeNormalOctahedron()</text>
  <text x="32" y="216" font-family="DM Sans,sans-serif" font-size="11" fill="#6e685c">includes/common/encoding.glsl &#8212; assumes [0,1] input</text>

  <line x1="235" y1="222" x2="235" y2="242" stroke="#3d4a58" stroke-width="1.5" marker-end="url(#oc-arrow)"/>

  <!-- consumers -->
  <g font-family="IBM Plex Mono,monospace" font-size="10" fill="#e8e2d6">
    <rect x="20" y="246" width="138" height="24" rx="2" fill="#1a222c" stroke="#3d4a58"/>
    <text x="30" y="262">deferred_lighting.frag</text>
    <rect x="166" y="246" width="94" height="24" rx="2" fill="#1a222c" stroke="#3d4a58"/>
    <text x="176" y="262">ssao.comp</text>
    <rect x="268" y="246" width="88" height="24" rx="2" fill="#1a222c" stroke="#3d4a58"/>
    <text x="278" y="262">ssr.comp</text>
    <rect x="364" y="246" width="86" height="24" rx="2" fill="#1a222c" stroke="#3d4a58"/>
    <text x="374" y="262">rt_gi.rgen</text>
    <rect x="20" y="276" width="138" height="24" rx="2" fill="#1a222c" stroke="#3d4a58"/>
    <text x="30" y="292">rt_shadow.rgen</text>
  </g>

  <!-- ============ orphans (right) ============ -->
  <line x1="470" y1="20" x2="470" y2="300" stroke="#3d4a58" stroke-dasharray="3 4"/>
  <text x="490" y="24" font-family="IBM Plex Mono,monospace" font-size="11" fill="#6e685c">NO CALLERS</text>

  <rect x="490" y="36" width="210" height="76" rx="3" fill="#0f1419" stroke="#3d4a58" stroke-dasharray="4 3"/>
  <text x="502" y="55" font-family="IBM Plex Mono,monospace" font-size="11" fill="#6e685c">encodeNormalOctahedron()</text>
  <text x="502" y="70" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">encoding.glsl &#183; returns [-1,1]</text>
  <text x="502" y="85" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">not the inverse of the decoder</text>
  <text x="502" y="100" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">beside it &#8212; range remap missing</text>

  <rect x="490" y="126" width="210" height="76" rx="3" fill="#0f1419" stroke="#3d4a58" stroke-dasharray="4 3"/>
  <text x="502" y="145" font-family="IBM Plex Mono,monospace" font-size="11" fill="#6e685c">octEncode() / octDecode()</text>
  <text x="502" y="160" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">math.glsl &#183; a third implementation</text>
  <text x="502" y="175" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">self-consistent [0,1] pair &#8212; the</text>
  <text x="502" y="190" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">only round-trip-correct one here</text>

  <text x="490" y="228" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">The producer never includes the</text>
  <text x="490" y="243" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">shared header; the consumers all do.</text>
  <text x="490" y="258" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">The &#215;0.5+0.5 that reconciles the two</text>
  <text x="490" y="273" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">conventions exists in exactly one</text>
  <text x="490" y="288" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">place: gbuffer.frag&#8217;s call site.</text>
</svg>

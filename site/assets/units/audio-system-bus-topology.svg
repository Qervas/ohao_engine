<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" class="unit-diagram" role="img" aria-label="The shipped audio graph: voices into their bus's sound group, each group into the bus's own node (gain, low-pass, mute and solo gate), each node into its parent's group up to the endpoint, with a send from a bus node to the return bus">
<defs>
  <marker id="ahd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#3d4a58"/>
  </marker>
  <marker id="ahm" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#6e685c"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#0f1419"/>

<text x="24" y="26" fill="#c4a574" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="1.5">SIGNAL TOPOLOGY — A BUS IS A GROUP AND A NODE</text>

<!-- voices -->
<rect x="24" y="56" width="120" height="26" rx="3" fill="#1a222c" stroke="#3d4a58"/>
<text x="32" y="73" fill="#e8e2d6" font-family="IBM Plex Mono,monospace" font-size="10">voice  fire</text>
<rect x="24" y="92" width="120" height="26" rx="3" fill="#1a222c" stroke="#3d4a58"/>
<text x="32" y="109" fill="#e8e2d6" font-family="IBM Plex Mono,monospace" font-size="10">voice  enemy_fire</text>
<rect x="24" y="156" width="120" height="26" rx="3" fill="#1a222c" stroke="#3d4a58"/>
<text x="32" y="173" fill="#e8e2d6" font-family="IBM Plex Mono,monospace" font-size="10">voice  footstep</text>
<rect x="24" y="232" width="120" height="26" rx="3" fill="#1a222c" stroke="#3d4a58"/>
<text x="32" y="249" fill="#e8e2d6" font-family="IBM Plex Mono,monospace" font-size="10">voice  hurt</text>

<!-- leaf buses: group + node -->
<rect x="176" y="72" width="70" height="26" rx="3" fill="#1a222c" stroke="#7dba8a"/>
<text x="183" y="89" fill="#7dba8a" font-family="IBM Plex Mono,monospace" font-size="10">weapons</text>
<rect x="256" y="72" width="54" height="26" rx="3" fill="#1a222c" stroke="#c4a574"/>
<text x="263" y="89" fill="#c4a574" font-family="IBM Plex Mono,monospace" font-size="10">node</text>
<rect x="176" y="156" width="70" height="26" rx="3" fill="#1a222c" stroke="#7dba8a"/>
<text x="183" y="173" fill="#7dba8a" font-family="IBM Plex Mono,monospace" font-size="10">foley</text>
<rect x="256" y="156" width="54" height="26" rx="3" fill="#1a222c" stroke="#c4a574"/>
<text x="263" y="173" fill="#c4a574" font-family="IBM Plex Mono,monospace" font-size="10">node</text>
<rect x="176" y="232" width="70" height="26" rx="3" fill="#1a222c" stroke="#7dba8a"/>
<text x="183" y="249" fill="#7dba8a" font-family="IBM Plex Mono,monospace" font-size="10">voice</text>
<rect x="256" y="232" width="54" height="26" rx="3" fill="#1a222c" stroke="#c4a574"/>
<text x="263" y="249" fill="#c4a574" font-family="IBM Plex Mono,monospace" font-size="10">node</text>

<line x1="144" y1="69"  x2="174" y2="82"  stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>
<line x1="144" y1="105" x2="174" y2="90"  stroke="#3d4a58" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ahd)"/>
<text x="62" y="134" fill="#6e685c" font-family="DM Sans,sans-serif" font-size="10">occluded: through a low-pass</text>
<line x1="144" y1="169" x2="174" y2="169" stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>
<line x1="144" y1="245" x2="174" y2="245" stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>
<line x1="246" y1="85"  x2="254" y2="85"  stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>
<line x1="246" y1="169" x2="254" y2="169" stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>
<line x1="246" y1="245" x2="254" y2="245" stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>

<!-- world -->
<rect x="350" y="114" width="70" height="26" rx="3" fill="#1a222c" stroke="#7dba8a"/>
<text x="357" y="131" fill="#7dba8a" font-family="IBM Plex Mono,monospace" font-size="10">world</text>
<rect x="430" y="114" width="54" height="26" rx="3" fill="#1a222c" stroke="#c4a574"/>
<text x="437" y="131" fill="#c4a574" font-family="IBM Plex Mono,monospace" font-size="10">node</text>
<line x1="310" y1="85"  x2="348" y2="122" stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>
<line x1="310" y1="169" x2="348" y2="132" stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>
<line x1="420" y1="127" x2="428" y2="127" stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>

<!-- reverb return -->
<rect x="350" y="196" width="70" height="26" rx="3" fill="#1a222c" stroke="#7dba8a"/>
<text x="357" y="213" fill="#7dba8a" font-family="IBM Plex Mono,monospace" font-size="10">reverb</text>
<rect x="430" y="196" width="54" height="26" rx="3" fill="#1a222c" stroke="#c4a574"/>
<text x="437" y="213" fill="#c4a574" font-family="IBM Plex Mono,monospace" font-size="10">node</text>
<line x1="296" y1="98"  x2="356" y2="194" stroke="#6e685c" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ahm)"/>
<line x1="296" y1="182" x2="350" y2="200" stroke="#6e685c" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ahm)"/>
<line x1="420" y1="209" x2="428" y2="209" stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>

<!-- master -->
<rect x="526" y="156" width="70" height="26" rx="3" fill="#1a222c" stroke="#7dba8a"/>
<text x="533" y="173" fill="#7dba8a" font-family="IBM Plex Mono,monospace" font-size="10">master</text>
<rect x="606" y="156" width="54" height="26" rx="3" fill="#1a222c" stroke="#c4a574"/>
<text x="613" y="173" fill="#c4a574" font-family="IBM Plex Mono,monospace" font-size="10">node</text>
<line x1="484" y1="127" x2="524" y2="162" stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>
<line x1="484" y1="209" x2="524" y2="176" stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>
<line x1="310" y1="245" x2="524" y2="180" stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>
<line x1="596" y1="169" x2="604" y2="169" stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>

<rect x="626" y="226" width="70" height="40" rx="3" fill="#1a222c" stroke="#c4784a"/>
<text x="634" y="243" fill="#c4784a" font-family="IBM Plex Mono,monospace" font-size="10">ma_engine</text>
<text x="634" y="258" fill="#c4784a" font-family="IBM Plex Mono,monospace" font-size="10">endpoint</text>
<line x1="633" y1="182" x2="660" y2="224" stroke="#3d4a58" stroke-width="1" marker-end="url(#ahd)"/>

<!-- legend -->
<text x="350" y="62" fill="#7dba8a" font-family="IBM Plex Mono,monospace" font-size="10">group</text>
<text x="392" y="62" fill="#6e685c" font-family="DM Sans,sans-serif" font-size="11">ma_sound_group: the category volume</text>
<text x="350" y="80" fill="#c4a574" font-family="IBM Plex Mono,monospace" font-size="10">node</text>
<text x="392" y="80" fill="#6e685c" font-family="DM Sans,sans-serif" font-size="11">gain in dB, low-pass, mute/solo gate</text>
<text x="350" y="98" fill="#6e685c" font-family="IBM Plex Mono,monospace" font-size="10">- - -</text>
<text x="392" y="98" fill="#6e685c" font-family="DM Sans,sans-serif" font-size="11">a node's send (output 1) to the return</text>

<text x="24" y="310" fill="#6e685c" font-family="IBM Plex Mono,monospace" font-size="10">The slice's bank (assets/audio/slice.audio.json), in part. Conceptual; buildBuses in audio_system.cpp makes it.</text>
</svg>

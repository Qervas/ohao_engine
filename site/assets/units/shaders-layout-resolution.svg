<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" class="unit-diagram" role="img" aria-label="How a shader source path becomes a flat SPIR-V filename and how the runtime finds it: glslc flattens directory separators to underscores into build/shaders, renderer_test mirrors that directory to build/bin/shaders, and the C++ loader tries the bin/shaders literal first (a hit when the working directory is build/), then build/shaders with the basename only (a hit from the repository root).">
  <rect x="0" y="0" width="720" height="360" fill="#0f1419"/>

  <text x="24" y="28" font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4a574">1 · SOURCE TREE</text>
  <rect x="24" y="38" width="248" height="46" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="38" y="60" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e8e2d6">shaders/rt/pt_raygen.rgen</text>
  <text x="38" y="76" font-family="DM Sans,sans-serif" font-size="11" fill="#6e685c">found by GLOB_RECURSE at configure time</text>

  <path d="M 272 61 L 316 61" stroke="#3d4a58" stroke-width="1.5" fill="none"/>
  <path d="M 316 61 l -7 -4 l 0 8 z" fill="#3d4a58"/>

  <text x="332" y="28" font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4a574">2 · COMPILE</text>
  <rect x="332" y="38" width="364" height="66" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="346" y="58" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">glslc --target-env=vulkan1.3</text>
  <text x="346" y="74" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">-I shaders  -I shaders/includes</text>
  <text x="346" y="92" font-family="DM Sans,sans-serif" font-size="11" fill="#6e685c">no -D flags: one variant per source file</text>

  <path d="M 514 104 L 514 136" stroke="#3d4a58" stroke-width="1.5" fill="none"/>
  <path d="M 514 136 l -4 -7 l 8 0 z" fill="#3d4a58"/>
  <text x="526" y="126" font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4784a">"/" &#8594; "_"</text>

  <text x="24" y="160" font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4a574">3 · BUILD OUTPUT (flat namespace)</text>
  <rect x="332" y="146" width="364" height="42" rx="4" fill="#1a222c" stroke="#c4784a"/>
  <text x="346" y="172" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e8e2d6">build/shaders/rt_pt_raygen.rgen.spv</text>

  <rect x="24" y="146" width="248" height="42" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="38" y="166" font-family="DM Sans,sans-serif" font-size="11" fill="#6e685c">also CMake&#8217;s own build dir for</text>
  <text x="38" y="181" font-family="DM Sans,sans-serif" font-size="11" fill="#6e685c">shaders/ &#8212; Makefile, CMakeFiles/</text>

  <path d="M 332 167 L 280 167" stroke="#3d4a58" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

  <text x="24" y="206" font-family="DM Sans,sans-serif" font-size="11" fill="#6e685c">renderer_test mirrors this directory to build/bin/shaders/ at link time</text>

  <text x="24" y="222" font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4a574">4 · RUNTIME LOOKUP (relative to the process CWD)</text>

  <rect x="24" y="234" width="410" height="34" rx="4" fill="#1a222c" stroke="#7dba8a"/>
  <text x="38" y="256" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">bin/shaders/rt_pt_raygen.rgen.spv</text>
  <text x="452" y="256" font-family="DM Sans,sans-serif" font-size="11" fill="#7dba8a">hit, if CWD is build/</text>

  <rect x="24" y="274" width="410" height="34" rx="4" fill="#1a222c" stroke="#7dba8a"/>
  <text x="38" y="296" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">build/shaders/ + basename</text>
  <text x="452" y="296" font-family="DM Sans,sans-serif" font-size="11" fill="#7dba8a">hit, if CWD is the repo root</text>

  <rect x="24" y="314" width="410" height="34" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="38" y="336" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">build/Release/bin/shaders/ + basename</text>
  <text x="452" y="336" font-family="DM Sans,sans-serif" font-size="11" fill="#6e685c">multi-config generators</text>

  <path d="M 514 188 L 514 206 L 470 206 L 470 234" stroke="#3d4a58" stroke-width="1.5" fill="none"/>
  <path d="M 470 234 l -4 -7 l 8 0 z" fill="#3d4a58"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" class="unit-diagram" role="img" aria-label="Diagram comparing which frustum corner pairs the cascade split loop interpolates against the near-to-far pairs a depth slice requires.">
  <defs>
    <marker id="csmArrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c4784a"/>
    </marker>
    <marker id="csmArrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dba8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="340" fill="#0f1419"/>

  <text x="20" y="26" font-family="DM Sans,sans-serif" font-size="14" fill="#e8e2d6">Frustum corner enumeration: idx = 4x + 2y + z  (z = 0 near plane, z = 1 far plane)</text>

  <!-- ============ PANEL A ============ -->
  <rect x="20" y="42" width="330" height="278" rx="4" fill="#1a222c" stroke="#3d4a58" stroke-width="1"/>
  <text x="36" y="66" font-family="IBM Plex Mono,monospace" font-size="12" fill="#c4a574">corners[i + 4] − corners[i]</text>
  <text x="36" y="84" font-family="DM Sans,sans-serif" font-size="12" fill="#6e685c">as written — pairs share a depth plane</text>

  <!-- frustum side edges -->
  <g stroke="#3d4a58" stroke-width="1" stroke-dasharray="3 3" fill="none">
    <line x1="75" y1="196" x2="205" y2="254"/>
    <line x1="75" y1="136" x2="205" y2="118"/>
    <line x1="125" y1="196" x2="315" y2="254"/>
    <line x1="125" y1="136" x2="315" y2="118"/>
  </g>
  <!-- near quad -->
  <rect x="75" y="136" width="50" height="60" fill="none" stroke="#3d4a58" stroke-width="1.4"/>
  <!-- far quad -->
  <rect x="205" y="118" width="110" height="136" fill="none" stroke="#3d4a58" stroke-width="1.4"/>
  <!-- the pairs the loop uses -->
  <g stroke="#c4784a" stroke-width="2.2" fill="none" marker-end="url(#csmArrowA)">
    <line x1="75" y1="196" x2="120" y2="196"/>
    <line x1="75" y1="136" x2="120" y2="136"/>
    <line x1="205" y1="254" x2="310" y2="254"/>
    <line x1="205" y1="118" x2="310" y2="118"/>
  </g>
  <g font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">
    <circle cx="75" cy="196" r="8" fill="#0f1419" stroke="#6e685c"/><text x="75" y="200" text-anchor="middle">0</text>
    <circle cx="75" cy="136" r="8" fill="#0f1419" stroke="#6e685c"/><text x="75" y="140" text-anchor="middle">2</text>
    <circle cx="125" cy="196" r="8" fill="#0f1419" stroke="#6e685c"/><text x="125" y="200" text-anchor="middle">4</text>
    <circle cx="125" cy="136" r="8" fill="#0f1419" stroke="#6e685c"/><text x="125" y="140" text-anchor="middle">6</text>
    <circle cx="205" cy="254" r="8" fill="#0f1419" stroke="#6e685c"/><text x="205" y="258" text-anchor="middle">1</text>
    <circle cx="205" cy="118" r="8" fill="#0f1419" stroke="#6e685c"/><text x="205" y="122" text-anchor="middle">3</text>
    <circle cx="315" cy="254" r="8" fill="#0f1419" stroke="#6e685c"/><text x="315" y="258" text-anchor="middle">5</text>
    <circle cx="315" cy="118" r="8" fill="#0f1419" stroke="#6e685c"/><text x="315" y="122" text-anchor="middle">7</text>
  </g>
  <text x="36" y="300" font-family="DM Sans,sans-serif" font-size="11" fill="#c4784a">direction = a horizontal edge; depth never enters</text>

  <!-- ============ PANEL B ============ -->
  <rect x="370" y="42" width="330" height="278" rx="4" fill="#1a222c" stroke="#3d4a58" stroke-width="1"/>
  <text x="386" y="66" font-family="IBM Plex Mono,monospace" font-size="12" fill="#c4a574">corners[i + 1] − corners[i], i even</text>
  <text x="386" y="84" font-family="DM Sans,sans-serif" font-size="12" fill="#6e685c">what a depth slice needs — near to far</text>

  <g stroke="#3d4a58" stroke-width="1" stroke-dasharray="3 3" fill="none">
    <line x1="425" y1="196" x2="555" y2="254"/>
    <line x1="425" y1="136" x2="555" y2="118"/>
    <line x1="475" y1="196" x2="665" y2="254"/>
    <line x1="475" y1="136" x2="665" y2="118"/>
  </g>
  <rect x="425" y="136" width="50" height="60" fill="none" stroke="#3d4a58" stroke-width="1.4"/>
  <rect x="555" y="118" width="110" height="136" fill="none" stroke="#3d4a58" stroke-width="1.4"/>
  <g stroke="#7dba8a" stroke-width="2.2" fill="none" marker-end="url(#csmArrowB)">
    <line x1="425" y1="196" x2="550" y2="252"/>
    <line x1="425" y1="136" x2="550" y2="120"/>
    <line x1="475" y1="196" x2="660" y2="252"/>
    <line x1="475" y1="136" x2="660" y2="120"/>
  </g>
  <g font-family="IBM Plex Mono,monospace" font-size="11" fill="#e8e2d6">
    <circle cx="425" cy="196" r="8" fill="#0f1419" stroke="#6e685c"/><text x="425" y="200" text-anchor="middle">0</text>
    <circle cx="425" cy="136" r="8" fill="#0f1419" stroke="#6e685c"/><text x="425" y="140" text-anchor="middle">2</text>
    <circle cx="475" cy="196" r="8" fill="#0f1419" stroke="#6e685c"/><text x="475" y="200" text-anchor="middle">4</text>
    <circle cx="475" cy="136" r="8" fill="#0f1419" stroke="#6e685c"/><text x="475" y="140" text-anchor="middle">6</text>
    <circle cx="555" cy="254" r="8" fill="#0f1419" stroke="#6e685c"/><text x="555" y="258" text-anchor="middle">1</text>
    <circle cx="555" cy="118" r="8" fill="#0f1419" stroke="#6e685c"/><text x="555" y="122" text-anchor="middle">3</text>
    <circle cx="665" cy="254" r="8" fill="#0f1419" stroke="#6e685c"/><text x="665" y="258" text-anchor="middle">5</text>
    <circle cx="665" cy="118" r="8" fill="#0f1419" stroke="#6e685c"/><text x="665" y="122" text-anchor="middle">7</text>
  </g>
  <text x="386" y="300" font-family="DM Sans,sans-serif" font-size="11" fill="#7dba8a">direction = a view ray; scaling it walks the split range</text>
</svg>

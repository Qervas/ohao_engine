<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" class="unit-diagram" role="img" aria-label="Dependency graph of the eight OHAO static archives. Solid arrows are declared CMake target_link_libraries edges: runtime to ecs and gpu_vulkan, ecs to renderer, renderer to gpu_vulkan, gpu_vulkan to scene, scene to core, and physics and audio to core. One dashed arrow is an include-only edge with no matching link edge: gpu_vulkan back up into renderer. Physics depends on no scene, gpu, render or ecs archive. Third-party edges and transitive core and scene edges are not drawn.">
  <rect x="0" y="0" width="720" height="520" fill="#0f1419"/>

  <defs>
    <marker id="mmDecl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dba8a"/>
    </marker>
    <marker id="mmUndecl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c4784a"/>
    </marker>
  </defs>

  <text x="24" y="30" font-family="DM Sans,sans-serif" font-size="15" fill="#e8e2d6">Declared link graph vs. actual include graph</text>

  <!-- archives, top (host) to bottom (leaf) -->
  <rect x="150" y="50" width="210" height="46" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="255" y="72" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#e8e2d6">ohao_runtime</text>
  <text x="255" y="87" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">window · input · clock · Application</text>
  <rect x="150" y="126" width="210" height="46" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="255" y="148" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#e8e2d6">ohao_ecs</text>
  <text x="255" y="163" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">EnTT · systems · render extract</text>
  <rect x="150" y="202" width="210" height="46" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="255" y="224" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#e8e2d6">ohao_renderer</text>
  <text x="255" y="239" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">deferred · rt · graph · RenderScene</text>
  <rect x="150" y="278" width="210" height="46" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="255" y="300" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#e8e2d6">ohao_gpu_vulkan</text>
  <text x="255" y="315" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">device · upload · BLAS/TLAS · bindless</text>
  <rect x="150" y="354" width="210" height="46" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="255" y="376" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#e8e2d6">ohao_scene</text>
  <text x="255" y="391" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">model loaders · primitives</text>
  <rect x="150" y="430" width="210" height="46" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="255" y="452" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#e8e2d6">ohao_core</text>
  <text x="255" y="467" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">concepts · GPU layout asserts · events</text>
  <rect x="440" y="354" width="170" height="46" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="525" y="376" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#e8e2d6">ohao_physics</text>
  <text x="525" y="391" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">Jolt / null · no engine edges</text>
  <rect x="440" y="430" width="170" height="46" rx="4" fill="#1a222c" stroke="#3d4a58"/>
  <text x="525" y="452" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#e8e2d6">ohao_audio</text>
  <text x="525" y="467" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="10" fill="#6e685c">miniaudio · no GPU edge</text>

  <!-- declared edges (solid, green) -->
  <path d="M 255 96 L 255 122" stroke="#7dba8a" stroke-width="1.6" fill="none" marker-end="url(#mmDecl)"/>
  <path d="M 255 172 L 255 198" stroke="#7dba8a" stroke-width="1.6" fill="none" marker-end="url(#mmDecl)"/>
  <path d="M 255 248 L 255 274" stroke="#7dba8a" stroke-width="1.6" fill="none" marker-end="url(#mmDecl)"/>
  <path d="M 255 324 L 255 350" stroke="#7dba8a" stroke-width="1.6" fill="none" marker-end="url(#mmDecl)"/>
  <path d="M 255 400 L 255 426" stroke="#7dba8a" stroke-width="1.6" fill="none" marker-end="url(#mmDecl)"/>
  <path d="M 360 73 L 392 73 L 392 301 L 364 301" stroke="#7dba8a" stroke-width="1.6" fill="none" marker-end="url(#mmDecl)"/>
  <path d="M 440 453 L 364 453" stroke="#7dba8a" stroke-width="1.6" fill="none" marker-end="url(#mmDecl)"/>
  <path d="M 525 400 L 525 414 L 330 414 L 330 426" stroke="#7dba8a" stroke-width="1.6" fill="none" marker-end="url(#mmDecl)"/>

  <!-- undeclared include-only edge (dashed, accent) -->
  <path d="M 150 301 L 110 301 L 110 225 L 146 225" stroke="#c4784a" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#mmUndecl)"/>
  <text x="102" y="258" text-anchor="end" font-family="DM Sans,sans-serif" font-size="10" fill="#c4784a">21 #includes</text>
  <text x="102" y="272" text-anchor="end" font-family="DM Sans,sans-serif" font-size="10" fill="#c4784a">no link edge</text>

  <!-- legend -->
  <line x1="24" y1="500" x2="60" y2="500" stroke="#7dba8a" stroke-width="1.6" marker-end="url(#mmDecl)"/>
  <text x="70" y="504" font-family="DM Sans,sans-serif" font-size="11" fill="#e8e2d6">target_link_libraries edge</text>
  <line x1="270" y1="500" x2="306" y2="500" stroke="#c4784a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mmUndecl)"/>
  <text x="316" y="504" font-family="DM Sans,sans-serif" font-size="11" fill="#e8e2d6">#include edge with no link edge</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 512" class="unit-diagram" role="img"
     aria-label="Side elevation of the SceneFramer room: a 30-by-30 unit box, a model scaled to 18 units standing on the floor, the camera outside the open front wall at z equals 25.5, its 45 degree vertical frustum, and the four studio light spheres held clear of the walls.">
  <rect width="720" height="512" fill="#0f1419"/>

  <!-- room interior -->
  <rect x="73.5" y="53.5" width="405" height="405" fill="#1a222c" stroke="none"/>

  <!-- solid walls: back, ceiling, floor -->
  <path d="M478.5 53.5 L73.5 53.5 L73.5 458.5 L478.5 458.5" fill="none" stroke="#3d4a58" stroke-width="2.5"/>
  <!-- front: no wall in model_viewer -->
  <line x1="478.5" y1="53.5" x2="478.5" y2="458.5" stroke="#3d4a58" stroke-width="1.6" stroke-dasharray="5 6"/>

  <!-- camera frustum, 45 degrees vertical -->
  <path d="M620 337 L73.5 110.5 L73.5 458.5 L327 458.5 Z" fill="#c4784a" fill-opacity="0.07" stroke="none"/>
  <line x1="620" y1="337" x2="73.5" y2="110.5" stroke="#c4784a" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="620" y1="337" x2="327" y2="458.5" stroke="#c4784a" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="620" y1="337" x2="73.5" y2="337" stroke="#c4784a" stroke-width="1" stroke-opacity="0.45"/>

  <!-- model: feet on floor y=-15, head at y=+3 -->
  <rect x="249" y="215.5" width="54" height="243" fill="#6e685c" fill-opacity="0.55" stroke="#e8e2d6" stroke-width="1.4"/>
  <line x1="249" y1="215.5" x2="303" y2="215.5" stroke="#7dba8a" stroke-width="2.5"/>
  <line x1="249" y1="458.5" x2="303" y2="458.5" stroke="#7dba8a" stroke-width="2.5"/>

  <!-- light spheres (radii to scale) -->
  <circle cx="303" cy="83.9" r="16.2" fill="#c4a574" fill-opacity="0.28" stroke="#c4a574" stroke-width="1.4"/>
  <circle cx="448" cy="256" r="16.2" fill="#c4a574" fill-opacity="0.28" stroke="#c4a574" stroke-width="1.4"/>
  <circle cx="100.5" cy="377.5" r="13.5" fill="#c4a574" fill-opacity="0.28" stroke="#c4a574" stroke-width="1.4"/>
  <circle cx="343.5" cy="215.5" r="20.25" fill="#c4a574" fill-opacity="0.12" stroke="#c4a574" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- ceiling clearance callout -->
  <line x1="303" y1="53.5" x2="303" y2="67.7" stroke="#7dba8a" stroke-width="1.6"/>
  <line x1="298" y1="53.5" x2="308" y2="53.5" stroke="#7dba8a" stroke-width="1.6"/>
  <line x1="298" y1="67.7" x2="308" y2="67.7" stroke="#7dba8a" stroke-width="1.6"/>

  <!-- camera -->
  <path d="M620 328 L634 337 L620 346 Z" fill="#e8e2d6"/>
  <circle cx="620" cy="337" r="4" fill="#e8e2d6"/>

  <g font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4a574">
    <text x="316" y="79">CeilingLight r=1.2</text>
    <text x="316" y="93">y=0.85S=12.75</text>
    <text x="470" y="292" text-anchor="end">FrontFill r=1.2</text>
    <text x="470" y="305" text-anchor="end">z=0.85S=12.75</text>
    <text x="120" y="374">BedsideLamp r=1.0</text>
    <text x="120" y="388">z=-S+2</text>
    <text x="369" y="212">WindowLight r=1.5</text>
    <text x="369" y="226" fill="#6e685c">(out of plane, x=0.8S)</text>
    <text x="318" y="62" fill="#7dba8a">1.05 clear of ceiling</text>
  </g>

  <g font-family="IBM Plex Mono,monospace" font-size="11" fill="#6e685c">
    <text x="73.5" y="475" text-anchor="middle">z=-S</text>
    <text x="478.5" y="475" text-anchor="middle">z=+S</text>
    <text x="620" y="475" text-anchor="middle">z=1.7S</text>
    <text x="66" y="57" text-anchor="end">y=+S</text>
    <text x="66" y="462" text-anchor="end">y=-S</text>
    <text x="484" y="70">no front wall</text>
  </g>

  <g font-family="DM Sans,sans-serif" font-size="12" fill="#e8e2d6">
    <text x="276" y="205" text-anchor="middle">model: 1.2 S = 18 units tall</text>
    <text x="612" y="360" text-anchor="end">camera, 45° vertical FOV</text>
    <text x="612" y="376" text-anchor="end">y = -S + h/2, looking down -Z</text>
  </g>

  <g font-family="DM Sans,sans-serif" font-size="12" fill="#6e685c">
    <text x="60" y="500">Elevation in the Y–Z plane, drawn to scale at S = 15. Light radii shown true size.</text>
  </g>
</svg>

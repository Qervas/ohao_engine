<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Systems declare what they read and write; the scheduler builds waves of systems that can run in parallel; the snapshot and world.hash cover components, every system's state and the step's events.">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#97a0ad"/></marker>
  </defs>
  <rect width="960" height="420" rx="14" fill="#12151b"/>
  <g font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif">
    <text x="40" y="42" font-size="13" font-weight="700" letter-spacing="2" fill="#97a0ad">1 · DECLARE</text>
    <text x="370" y="42" font-size="13" font-weight="700" letter-spacing="2" fill="#97a0ad">2 · THE SCHEDULER BUILDS</text>
    <text x="700" y="42" font-size="13" font-weight="700" letter-spacing="2" fill="#97a0ad">3 · STATE IS COMPLETE</text>

    <rect x="40" y="60" width="300" height="300" rx="8" fill="#1b2029" stroke="#3a4352"/>
    <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#e7eaee">
      <text x="56" y="86">system("enemy_ai")</text>
      <text x="56" y="104" fill="#97a0ad">  .reads&lt;Transform, Health&gt;()</text>
      <text x="56" y="122" fill="#97a0ad">  .writes&lt;MoveIntent, Trigger&gt;()</text>
      <text x="56" y="152">system("physics")</text>
      <text x="56" y="170" fill="#97a0ad">  .reads&lt;MoveIntent&gt;()</text>
      <text x="56" y="188" fill="#97a0ad">  .writes&lt;Transform&gt;()</text>
      <text x="56" y="218">system("combat")</text>
      <text x="56" y="236" fill="#97a0ad">  .reads&lt;Transform, Trigger&gt;()</text>
      <text x="56" y="254" fill="#97a0ad">  .writes&lt;Health&gt;()</text>
      <text x="56" y="272" fill="#97a0ad">  .emits&lt;Shot, Hit&gt;()</text>
      <text x="56" y="302">system("audio") .reads&lt;Shot, Hit&gt;()</text>
      <text x="56" y="320">system("vfx")   .reads&lt;Shot, Hit&gt;()</text>
    </g>
    <text x="56" y="346" font-size="12" fill="#e5534b">a cycle or a missing system fails at install</text>

    <g font-size="12" fill="#e7eaee">
      <text x="370" y="84" font-size="11" fill="#97a0ad">wave 1</text>
      <rect x="370" y="92" width="130" height="34" rx="5" fill="#241d12" stroke="#f0a33a"/><text x="384" y="114">enemy_ai</text>
      <rect x="512" y="92" width="130" height="34" rx="5" fill="#241d12" stroke="#f0a33a"/><text x="526" y="114">player input</text>
      <text x="370" y="152" font-size="11" fill="#97a0ad">wave 2</text>
      <rect x="370" y="160" width="272" height="34" rx="5" fill="#1b2029" stroke="#3a4352"/><text x="384" y="182">physics (Jolt jobs inside)</text>
      <text x="370" y="220" font-size="11" fill="#97a0ad">wave 3</text>
      <rect x="370" y="228" width="272" height="34" rx="5" fill="#241d12" stroke="#f0a33a"/><text x="384" y="250">combat</text>
      <text x="370" y="288" font-size="11" fill="#97a0ad">wave 4</text>
      <rect x="370" y="296" width="84" height="34" rx="5" fill="#1b2029" stroke="#3a4352"/><text x="382" y="318">anim</text>
      <rect x="464" y="296" width="84" height="34" rx="5" fill="#1b2029" stroke="#3a4352"/><text x="476" y="318">audio</text>
      <rect x="558" y="296" width="84" height="34" rx="5" fill="#1b2029" stroke="#3a4352"/><text x="570" y="318">vfx</text>
      <line x1="506" y1="126" x2="506" y2="156" stroke="#97a0ad" marker-end="url(#a3)"/>
      <line x1="506" y1="194" x2="506" y2="224" stroke="#97a0ad" marker-end="url(#a3)"/>
      <line x1="506" y1="262" x2="506" y2="292" stroke="#97a0ad" marker-end="url(#a3)"/>
    </g>
    <text x="370" y="352" font-size="12" fill="#97a0ad">same order every run: results identical at 1 or 16 threads</text>

    <rect x="700" y="60" width="220" height="300" rx="8" fill="#161b22" stroke="#4fbf7f"/>
    <text x="716" y="86" font-size="13" font-weight="600" fill="#e7eaee">Snapshot = world.hash input</text>
    <g font-size="12" fill="#e7eaee">
      <rect x="716" y="100" width="188" height="44" rx="5" fill="#1b2029" stroke="#3a4352"/>
      <text x="728" y="120">saved components</text><text x="728" y="136" fill="#97a0ad">(as today)</text>
      <rect x="716" y="152" width="188" height="60" rx="5" fill="#1b2029" stroke="#4fbf7f"/>
      <text x="728" y="172">every system's own state</text><text x="728" y="188" fill="#97a0ad">grenades, round timer,</text><text x="728" y="204" fill="#97a0ad">Jolt bodies, audio, vfx</text>
      <rect x="716" y="220" width="188" height="44" rx="5" fill="#1b2029" stroke="#4fbf7f"/>
      <text x="728" y="240">the step's events</text><text x="728" y="256" fill="#97a0ad">typed, double-buffered</text>
      <rect x="716" y="272" width="188" height="72" rx="5" fill="#1b2029" stroke="#3a4352"/>
      <text x="728" y="292">a round restart is a</text><text x="728" y="308">request done at step end,</text><text x="728" y="324" fill="#97a0ad">not a restore inside</text><text x="728" y="338" fill="#97a0ad">the combat system</text>
    </g>
    <text x="40" y="396" font-size="13" fill="#4fbf7f">One install function for every host. Rollback, replay, hot reload and multiplayer all rest on complete state.</text>
  </g>
</svg>
